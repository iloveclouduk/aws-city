AWSTemplateFormatVersion: '2010-09-09'
Description: AWS City - the password drawer. A MySQL database on RDS whose password lives only in Secrets Manager (RDS creates, encrypts and rotates it), and a function behind an HTTP API that fetches the login at run time through a private endpoint. No password is ever typed into code or this template.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The library's VPC (DNS hostnames and DNS resolution turned on)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two private subnets in different Availability Zones

Resources:
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The library function
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to the Secrets Manager endpoint
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL to the database
      Tags:
        - Key: managed-by
          Value: aws-city

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL from the library function only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
          Description: The library function
      Tags:
        - Key: managed-by
          Value: aws-city

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from the library function only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
          Description: The library function
      Tags:
        - Key: managed-by
          Value: aws-city

  SecretsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: The library database's private subnets
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: managed-by
          Value: aws-city

  LibraryDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: librarian
      # RDS keeps the password in Secrets Manager, encrypted with KMS, and rotates it (every 7 days unless you change it).
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: managed-by
          Value: aws-city

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: read-this-secret-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt LibraryDatabase.MasterUserSecret.SecretArn
      Tags:
        - Key: managed-by
          Value: aws-city

  LibraryFunction:
    Type: AWS::Lambda::Function
    DependsOn: SecretsEndpoint
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 128
      Timeout: 10
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref FunctionSecurityGroup
      Environment:
        Variables:
          SECRET_ARN: !GetAtt LibraryDatabase.MasterUserSecret.SecretArn
          DB_HOST: !GetAtt LibraryDatabase.Endpoint.Address
      Code:
        ZipFile: |
          const { SecretsManagerClient, GetSecretValueCommand } = require('@aws-sdk/client-secrets-manager');
          const sm = new SecretsManagerClient({});
          exports.handler = async () => {
            // Fetched each time, so a rotated password is picked up without a redeploy. Connect with your MySQL driver here.
            const s = JSON.parse((await sm.send(new GetSecretValueCommand({ SecretId: process.env.SECRET_ARN }))).SecretString);
            return { statusCode: 200, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: s.username, host: process.env.DB_HOST, password: 'fetched, never shown' }) };
          };
      Tags:
        - Key: managed-by
          Value: aws-city

  LibraryApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-library'
      ProtocolType: HTTP
      Target: !GetAtt LibraryFunction.Arn
      Tags:
        managed-by: aws-city

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LibraryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${LibraryApi}/*'

Outputs:
  ApiUrl:
    Description: Shows which login the function fetched (never the password)
    Value: !GetAtt LibraryApi.ApiEndpoint
  SecretArn:
    Description: The database password's secret (change its rotation to 30 days in Secrets Manager if you like)
    Value: !GetAtt LibraryDatabase.MasterUserSecret.SecretArn
