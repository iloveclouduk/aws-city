AWSTemplateFormatVersion: '2010-09-09'
Description: AWS City - an on-demand DynamoDB table with a partition key and point-in-time recovery.

Resources:
  CityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: managed-by
          Value: aws-city

Outputs:
  TableName:
    Description: The table's name
    Value: !Ref CityTable
