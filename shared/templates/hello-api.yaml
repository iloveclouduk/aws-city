AWSTemplateFormatVersion: '2010-09-09'
Description: AWS City - a serverless API. An HTTP API in API Gateway invokes a Lambda function that runs with a least-privilege role.

Resources:
  HelloRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Only what the function needs: writing its own logs.
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Tags:
        - Key: managed-by
          Value: aws-city

  HelloFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt HelloRole.Arn
      MemorySize: 128
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (event) => ({
            statusCode: 200,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ hello: 'from AWS City', path: event.rawPath }),
          });
      Tags:
        - Key: managed-by
          Value: aws-city

  # Quick create: Target makes the default route, the Lambda integration and the $default stage.
  HelloApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      Target: !GetAtt HelloFunction.Arn
      Tags:
        managed-by: aws-city

  HelloPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HelloFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HelloApi}/*'

Outputs:
  ApiUrl:
    Description: Open it in a browser
    Value: !GetAtt HelloApi.ApiEndpoint
